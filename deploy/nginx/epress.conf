# ════════════════════════════════════════════════════════════════════════════
# E-Press nginx vhost
# Domain: epress.ga (www.epress.ga redirects to apex)
# Backend: pm2 process epress-backend on 127.0.0.1:5004
# Admin SPA: built bundle in /var/www/epress/admin-panel/dist
# Landing: static files in /var/www/epress/landing
# ════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect (certbot rewrites this once SSL is installed) ─────
server {
    listen 80;
    listen [::]:80;
    server_name epress.ga www.epress.ga;

    # ACME challenge needs to work over plain HTTP forever
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything else: redirect to HTTPS. Until certbot runs, this redirect
    # will point at https://epress.ga which doesn't exist yet — that's
    # expected; the install script tells you to run certbot next.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS vhost ─────────────────────────────────────────────────────────────
# Note: ssl_certificate paths are placeholders. certbot --nginx will rewrite
# these to point at /etc/letsencrypt/live/epress.ga/{fullchain,privkey}.pem
# and add the listen 443 ssl http2 directives. Until then this server block
# stays inert and only the HTTP one above is reachable.
# Legacy `listen ... ssl http2;` syntax — works on nginx 1.18+ (this box runs
# the Ubuntu 24.04 default). On 1.25+ the new `http2 on;` directive is
# preferred, but the legacy form is still accepted everywhere.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name epress.ga www.epress.ga;

    # Placeholder cert — certbot will replace these
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Apex-only canonical: www → apex
    if ($host = www.epress.ga) {
        return 301 https://epress.ga$request_uri;
    }

    # ── Logs ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/epress.access.log;
    error_log  /var/log/nginx/epress.error.log;

    # Big enough body for KYC photo uploads (5 docs × ~2-3 MB each)
    client_max_body_size 25m;

    # ── Backend API ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120;
        proxy_buffering    off;
    }

    # ── Socket.IO (separate path so the upgrade header is unambiguous) ─────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    # ── KYC / category uploads served straight from the backend uploads/ dir
    location /api/uploads/ {
        alias /var/www/epress/backend/uploads/;
        autoindex off;
        add_header Cache-Control "private, max-age=86400";
    }

    # ── APK downloads — served with the right MIME so Android treats them as installables
    # Files live at /var/www/epress/landing/downloads/ — install.sh creates the dir.
    # Drop epress.apk and epress-pro.apk into that folder (via Jenkins or manually).
    location /download/ {
        alias /var/www/epress/landing/downloads/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
        }
        # Force browsers to download instead of trying to display
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "public, max-age=300";
    }

    # ── Admin SPA ───────────────────────────────────────────────────────────
    location /admin/ {
        alias /var/www/epress/admin-panel/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html =404;
    }
    location = /admin { return 301 /admin/; }

    # ── Landing page (static) at root ──────────────────────────────────────
    location / {
        root /var/www/epress/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
