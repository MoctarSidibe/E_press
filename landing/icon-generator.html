<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            /* White background */
        }

        .icon-container {
            width: 1024px;
            height: 1024px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        ion-icon {
            font-size: 800px;
            /* Large icon size */
            color: #00D4D4;
            /* Primary color */
        }
    </style>
</head>

<body>
    <div class="icon-container" id="capture-area">
        <ion-icon name="water"></ion-icon>
    </div>
</body>

</html>
