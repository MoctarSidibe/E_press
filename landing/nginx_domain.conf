server {
    listen 80;
    server_name 161.97.66.69;
    return 301 http://www.epress.ga$request_uri;
}

server {
    listen 80;
    server_name epress.ga www.epress.ga;

    # Health check
    location = /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Landing page (for /landing/ path if kept, or root?)
    # User said "redirect http://161.97.66.69/ to new domain"
    # Usually domain root -> landing page
    # But current setup has /landing/ for landing and / for Admin.
    # If using a domain for the PRODUCT, usually www.epress.ga -> Landing Page.
    # And maybe admin.epress.ga -> Admin Panel.
    # BUT, based on current request "redirect IP to new domain", I should probably keep the structure but change the server_name.
    # However, if they want www.epress.ga to be the site, they probably want the landing page at the root.
    
    # Let's assume for now they want the same structure but on the domain.
    # BUT, typically a marketing domain points to the landing page.
    # Let's check the user request: "back to lading page... i want to redirect... to the new domain"
    # It implies www.epress.ga shows the landing page.
    
    # Let's configure:
    # www.epress.ga -> Landing Page
    # www.epress.ga/admin -> Admin Panel (or keep it at / if they want, but that conflicts)
    
    # Current IP setup:
    # / -> Admin
    # /landing/ -> Landing
    
    # If I change to domain:
    # www.epress.ga -> Should likely be Landing.
    # But then where is Admin?
    # I should ask or stick to safe mapping.
    # Safe mapping:
    # www.epress.ga/ -> Admin (Status Quo)
    # www.epress.ga/landing/ -> Landing (Status Quo)
    
    # Re-reading: "back to lading page... redirect... to new domain"
    # The context is heavily about the landing page.
    # I will stick to the current path structure to be safe, but just add the redirection.
    # Changes:
    # server_name epress.ga www.epress.ga;
    
    # Uploaded files (KYC docs, category GIFs — served by Node backend)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # Landing page
    location /landing/ {
        alias /var/www/epress-landing/;
        index index.html;
    }

    # Admin Panel (root)
    location / {
        root /var/www/epress-admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
